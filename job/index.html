<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta http-equiv="Content-Language" content="en">
    <title>Job - Mathematical Bible</title>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Georgia, serif; background: #f8f6f3; color: #2c2416; line-height: 1.8; }
.container { max-width: 1100px; margin: 0 auto; padding: 20px; }

/* Header */
h1 { text-align: center; margin-bottom: 10px; color: #1a365d; font-size: 2em; }
.subtitle { text-align: center; color: #666; margin-bottom: 20px; font-style: italic; }
.stats { text-align: center; color: #888; font-size: 0.9em; margin-bottom: 30px; }

/* Navigation */
nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
nav a { color: #1a365d; text-decoration: none; padding: 5px 10px; border: 1px solid #ddd; border-radius: 3px; }
nav a:hover { background: #1a365d; color: white; }

/* Section headers */
.section-header {
    color: #1a365d; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
    margin: 30px 0 15px; border-bottom: 2px solid #1a365d; padding-bottom: 8px;
}

/* Book grid */
.book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 30px; }
.book-card { padding: 12px; background: white; border: 1px solid #e0dcd5; text-decoration: none; color: #2c2416; border-radius: 4px; }
.book-card:hover { border-color: #1a365d; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.book-card.coming { opacity: 0.5; pointer-events: none; background: #f5f5f5; }
.book-name { font-weight: 600; font-size: 14px; }
.book-stats { font-size: 11px; color: #888; margin-top: 4px; }

/* Chapter navigation */
.chapter-nav { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 20px 0; }
.chapter-nav a { min-width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    border: 1px solid #ddd; text-decoration: none; color: #666; border-radius: 4px; font-size: 14px; }
.chapter-nav a:hover, .chapter-nav a.active { border-color: #1a365d; color: #1a365d; background: #f0f4f8; }

/* Verse display - Blue Letter Bible style */
.verse { margin: 20px 0; padding: 20px; background: white; border: 1px solid #e0dcd5; border-radius: 6px; }
.verse-ref { color: #1a365d; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
.verse-gematria { display: inline-block; background: #f0f4f8; padding: 2px 8px; border-radius: 3px;
    font-size: 12px; color: #1a365d; margin-left: 10px; font-family: monospace; }

/* Original text */
.original-text { font-size: 1.4em; line-height: 2; margin: 15px 0; padding: 15px;
    background: #fafaf8; border-radius: 4px; }
.hebrew { direction: rtl; text-align: right; font-family: 'SBL Hebrew', 'Ezra SIL', 'Times New Roman', serif; }
.greek { direction: ltr; text-align: left; font-family: 'SBL Greek', 'Gentium', 'Times New Roman', serif; }

/* Clickable words */
.word { cursor: pointer; padding: 4px 6px; border-radius: 3px; transition: all 0.2s; display: inline-block; margin: 2px; }
.word:hover { background: #e8e4d9; }
.word[data-gloss]:hover::after { content: attr(data-gloss); position: absolute; background: #333; color: white;
    padding: 4px 8px; border-radius: 4px; font-size: 12px; z-index: 100; margin-top: 30px; }

/* Translation */
.translation { font-size: 1.1em; line-height: 1.8; margin: 15px 0; padding: 15px;
    background: #fff; border-left: 4px solid #1a365d; }

/* Footnotes */
.footnotes { margin-top: 15px; padding: 15px; background: #f5f5f0; border-radius: 4px; font-size: 0.9em; }
.footnotes h4 { color: #1a365d; margin-bottom: 10px; font-size: 12px; text-transform: uppercase; }
.footnote { margin: 8px 0; padding-left: 20px; border-left: 2px solid #ddd; }
.footnote-marker { color: #1a365d; font-weight: bold; }
.footnote-alt { color: #666; font-style: italic; }

/* Word analysis panel */
.word-analysis { margin-top: 15px; padding: 15px; background: #f8f8f5; border-radius: 4px; }
.word-analysis h4 { color: #1a365d; margin-bottom: 10px; }
.letter-breakdown { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.letter-box { background: white; border: 1px solid #ddd; padding: 8px 12px; border-radius: 4px; text-align: center; min-width: 60px; }
.letter-char { font-size: 24px; color: #1a365d; }
.letter-name { font-size: 10px; color: #888; }
.letter-value { font-size: 14px; color: #1a365d; font-weight: bold; }
.letter-meaning { font-size: 9px; color: #666; margin-top: 4px; }

/* Gematria summary */
.gematria-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 20px 0; }
.gematria-box { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 6px; text-align: center; }
.gematria-level { font-size: 11px; color: #888; text-transform: uppercase; }
.gematria-value { font-size: 24px; color: #1a365d; font-weight: bold; font-family: monospace; }
.gematria-label { font-size: 12px; color: #666; }

/* Prev/Next navigation */
.page-nav { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; }
.page-nav a { color: #1a365d; text-decoration: none; padding: 10px 20px; border: 1px solid #ddd; border-radius: 4px; }
.page-nav a:hover { background: #f0f4f8; }

/* Footer */
footer { text-align: center; padding: 30px; color: #888; font-size: 12px; margin-top: 40px; border-top: 1px solid #ddd; }

/* RED LETTER - Jesus' Words */
.verse.red-letter { border-left: 4px solid #b91c1c; }
.verse.red-letter .verse-ref::before { content: "[Jesus speaks]"; color: #b91c1c; font-weight: bold; font-size: 11px; margin-right: 10px; text-transform: uppercase; }
.verse.red-letter .original-text { color: #b91c1c; font-weight: 600; }
.verse.red-letter .translation { color: #b91c1c; font-weight: 600; border-left-color: #b91c1c; }
.verse.red-letter .word { color: #b91c1c; }
.verse.red-letter .word:hover { background: #fee2e2; }

/* TSK Cross-References */
.cross-refs { margin-top: 15px; padding: 15px; background: #f0f8ff; border-radius: 4px; border-left: 4px solid #3b82f6; }
.cross-refs h4 { color: #1e40af; margin-bottom: 10px; font-size: 12px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.cross-refs h4::before { content: "TSK"; background: #3b82f6; color: white; padding: 2px 6px; border-radius: 3px; font-size: 10px; }
.cross-refs .theme-tag { display: inline-block; background: #1e40af; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 10px; font-weight: normal; text-transform: none; }
.cross-refs ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.cross-refs li { background: white; border: 1px solid #ddd; padding: 4px 10px; border-radius: 3px; font-size: 12px; }
.cross-refs li:hover { background: #e0f2fe; border-color: #3b82f6; cursor: pointer; }
.cross-refs .ref-verse { color: #1e40af; font-weight: 600; }
.cross-refs .ref-topic { color: #666; font-style: italic; margin-left: 5px; }

/* Modal for word details */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; }
.modal.show { display: flex; align-items: center; justify-content: center; }
.modal-content { background: white; padding: 30px; border-radius: 8px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    border-bottom: 2px solid #1a365d; padding-bottom: 15px; }
.modal-header h3 { margin: 0; color: #1a365d; font-size: 28px; }
.close-btn { font-size: 28px; cursor: pointer; color: #999; }
.close-btn:hover { color: #333; }

/* Responsive */
@media (max-width: 768px) {
    .book-grid { grid-template-columns: repeat(2, 1fr); }
    .gematria-summary { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
