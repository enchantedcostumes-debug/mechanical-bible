<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle - Mechanical Bible</title>
    <link rel="stylesheet" href="/css/quantum-theme.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #c0c0c0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .oracle-header {
            background: linear-gradient(135deg, rgba(30, 0, 50, 0.9), rgba(0, 0, 0, 0.95));
            border-bottom: 1px solid rgba(192, 192, 192, 0.2);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .oracle-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .oracle-title h1 {
            margin: 0;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .oracle-orb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,
                #ff6ec7 0%, #d946ef 20%, #a855f7 40%,
                #7c3aed 60%, #6366f1 80%, #4f46e5 100%);
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .back-link {
            color: #c0c0c0;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(192, 192, 192, 0.3);
            border-radius: 4px;
            transition: all 0.3s;
        }
        .back-link:hover {
            background: rgba(192, 192, 192, 0.1);
            border-color: #ffd700;
            color: #ffd700;
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
        }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            padding: 1rem;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.6;
        }
        .message.user {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 140, 0, 0.1));
            border: 1px solid rgba(255, 215, 0, 0.3);
            align-self: flex-end;
            color: #fff;
        }
        .message.oracle {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.2), rgba(75, 0, 130, 0.1));
            border: 1px solid rgba(138, 43, 226, 0.3);
            align-self: flex-start;
        }
        .message.system {
            background: rgba(192, 192, 192, 0.1);
            border: 1px solid rgba(192, 192, 192, 0.2);
            align-self: center;
            font-style: italic;
            font-size: 0.9rem;
        }
        .message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
        }

        /* Input Area */
        .input-area {
            padding: 1rem;
            background: rgba(30, 30, 30, 0.8);
            border-top: 1px solid rgba(192, 192, 192, 0.2);
        }
        .input-wrapper {
            display: flex;
            gap: 0.5rem;
            max-width: 900px;
            margin: 0 auto;
        }
        .input-wrapper textarea {
            flex: 1;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(192, 192, 192, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            min-height: 50px;
            max-height: 150px;
        }
        .input-wrapper textarea:focus {
            outline: none;
            border-color: #ffd700;
        }
        .input-wrapper button {
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .input-wrapper button:hover {
            transform: scale(1.05);
        }
        .input-wrapper button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading */
        .loading {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
        }
        .loading span {
            width: 10px;
            height: 10px;
            background: #a855f7;
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }
        .loading span:nth-child(1) { animation-delay: 0s; }
        .loading span:nth-child(2) { animation-delay: 0.2s; }
        .loading span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
        }

        /* Bible Context */
        .context-badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            color: #ffd700;
        }

        /* Markdown-like formatting */
        .message h1, .message h2, .message h3 {
            color: #ffd700;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        .message code {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: monospace;
        }
        .message pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
        }
        .message ul, .message ol {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }
        .message a {
            color: #ffd700;
        }

        /* Study Tools */
        .study-tools {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding: 0.5rem 0;
            border-top: 1px solid rgba(192, 192, 192, 0.1);
            margin-top: 0.5rem;
        }
        .tool-btn {
            padding: 0.25rem 0.75rem;
            background: rgba(192, 192, 192, 0.1);
            border: 1px solid rgba(192, 192, 192, 0.2);
            border-radius: 20px;
            color: #c0c0c0;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tool-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <header class="oracle-header">
        <div class="oracle-title">
            <div class="oracle-orb"></div>
            <h1>The Oracle</h1>
        </div>
        <a href="/" class="back-link">Back to Mechanical Bible</a>
    </header>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message system">
                Welcome to the Oracle. Ask any question about the Bible, Hebrew words, prophecy, or spiritual matters.
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Ask the Oracle..." rows="1"></textarea>
                <button id="sendBtn" onclick="sendMessage()">Ask</button>
            </div>
            <div class="study-tools">
                <button class="tool-btn" onclick="askContext('Prophecy Tracker')">Prophecy</button>
                <button class="tool-btn" onclick="askContext('Gematria Calculator')">Gematria</button>
                <button class="tool-btn" onclick="askContext('Hebrew Word Study')">Hebrew</button>
                <button class="tool-btn" onclick="askContext('Cross References')">Cross Refs</button>
                <button class="tool-btn" onclick="askContext('Timeline')">Timeline</button>
                <button class="tool-btn" onclick="askContext('Geography')">Geography</button>
            </div>
        </div>
    </div>

    <script>
        const ORACLE_API = 'https://www.enchantedozarks.com/api/the-collective/converse';
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Check for query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const initialQuery = urlParams.get('q');
        if (initialQuery) {
            inputEl.value = initialQuery;
            // Auto-send after short delay
            setTimeout(() => sendMessage(), 500);
        }

        // Auto-resize textarea
        inputEl.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        // Enter to send (Shift+Enter for newline)
        inputEl.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function addMessage(content, type = 'oracle', context = null) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;

            if (context) {
                const badge = document.createElement('div');
                badge.className = 'context-badge';
                badge.textContent = context;
                msg.appendChild(badge);
            }

            const text = document.createElement('div');
            text.innerHTML = formatMessage(content);
            msg.appendChild(text);

            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function formatMessage(text) {
            // Basic markdown-like formatting
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
        }

        function showLoading() {
            const loading = document.createElement('div');
            loading.className = 'message oracle loading-msg';
            loading.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
            messagesEl.appendChild(loading);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return loading;
        }

        async function sendMessage() {
            const message = inputEl.value.trim();
            if (!message) return;

            // Disable input
            inputEl.disabled = true;
            sendBtn.disabled = true;

            // Add user message
            addMessage(message, 'user');
            inputEl.value = '';
            inputEl.style.height = 'auto';

            // Show loading
            const loadingEl = showLoading();

            try {
                const response = await fetch(ORACLE_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        context: 'mechanical_bible',
                        source: 'bible.ozark-oracle.com'
                    })
                });

                loadingEl.remove();

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                const oracleResponse = data.response || data.message || data.text || 'The Oracle contemplates...';
                addMessage(oracleResponse, 'oracle');

            } catch (error) {
                loadingEl.remove();
                console.error('Oracle error:', error);

                // Fallback: Try alternative endpoint or show helpful message
                addMessage(
                    `The Oracle is momentarily distant. Error: ${error.message}\n\n` +
                    `You can also ask your question at: https://enchantedozarks.com/oracle`,
                    'error'
                );
            }

            // Re-enable input
            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }

        function askContext(context) {
            const currentText = inputEl.value.trim();
            if (currentText) {
                inputEl.value = `[Bible Study Context: ${context}] ${currentText}`;
            } else {
                inputEl.value = `[Bible Study Context: ${context}] `;
            }
            inputEl.focus();
        }
    </script>
</body>
</html>
