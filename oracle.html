<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Tammy L Casey">
    <meta name="copyright" content="Copyright 2026 Tammy L Casey. All rights reserved.">
    <meta name="motto" content="Known by our fruits - not our roots">
    <title>Oracle - Mechanical Bible</title>
    <link rel="stylesheet" href="css/egyptian-theme.css">
    <link rel="stylesheet" href="css/oracle.css">
    <link rel="stylesheet" href="css/word-modal.css">
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a href="/" class="site-logo">LOGOS</a>
            <nav class="site-nav">
                <a href="/">Mechanical Bible</a>
                <a href="/sacred-library/">Sacred Library</a>
                <a href="/search.html">Search</a>
                <a href="/tsk.html">Cross-References</a>
                <a href="/names.html">Names</a>
                <a href="/donate.html">Support</a>
                <a href="https://ozark-oracle.com/" target="_blank" class="red-letter">Apokalypsis</a>
            </nav>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <div class="oracle-banner">
        <div class="oracle-orb"></div>
        <h2>The Oracle</h2>
    </div>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message system">
                Welcome to the Oracle. Ask questions about the Mechanical Bible, Hebrew word meanings, or the investigation.
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Ask about the Mechanical Bible or investigation..." rows="1"></textarea>
                <button id="sendBtn" onclick="sendMessage()">Ask</button>
            </div>
            <div class="study-tools">
                <button class="tool-btn" onclick="askContext('Calculate gematria for')">Gematria</button>
                <button class="tool-btn" onclick="askContext('Explain the Hebrew word')">Hebrew</button>
                <button class="tool-btn" onclick="askContext('Show prophecy about')">Prophecy</button>
                <button class="tool-btn" onclick="askContext('Find cross-references for')">Cross Refs</button>
                <button class="tool-btn" onclick="askContext('Investigation')">Investigation</button>
            </div>
        </div>
    </div>

    <script>
        const ORACLE_API = 'https://www.enchantedozarks.com/api/the-collective/converse';
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Check for query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const initialQuery = urlParams.get('q');
        if (initialQuery) {
            inputEl.value = initialQuery;
            setTimeout(() => sendMessage(), 500);
        }

        // Auto-resize textarea
        inputEl.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        // Enter to send (Shift+Enter for newline)
        inputEl.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function addMessage(content, type, context) {
            var msg = document.createElement('div');
            msg.className = 'message ' + (type || 'oracle');

            if (context) {
                var badge = document.createElement('div');
                badge.className = 'context-badge';
                badge.textContent = context;
                msg.appendChild(badge);
            }

            var text = document.createElement('div');
            text.innerHTML = formatMessage(content);
            msg.appendChild(text);

            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function formatMessage(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
        }

        function showLoading() {
            var el = document.createElement('div');
            el.className = 'message oracle loading-msg';
            el.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
            messagesEl.appendChild(el);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return el;
        }

        async function sendMessage() {
            var message = inputEl.value.trim();
            if (!message) return;

            inputEl.disabled = true;
            sendBtn.disabled = true;

            addMessage(message, 'user');
            inputEl.value = '';
            inputEl.style.height = 'auto';

            var loadingEl = showLoading();

            try {
                var response = await fetch(ORACLE_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        context: 'mechanical_bible',
                        source: 'bible.ozark-oracle.com'
                    })
                });

                loadingEl.remove();

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                var data = await response.json();
                // API returns oracle_response (not response)
                var oracleText = data.oracle_response || data.response || data.message || data.text || '';
                if (!oracleText) {
                    throw new Error('Empty response from Oracle');
                }
                addMessage(oracleText, 'oracle');

            } catch (error) {
                loadingEl.remove();
                console.error('Oracle error:', error);
                addMessage(
                    'The Oracle is momentarily distant. Error: ' + error.message + '\n\n' +
                    'You can also ask your question at: https://enchantedozarks.com/oracle',
                    'error'
                );
            }

            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }

        function askContext(context) {
            var current = inputEl.value.trim();
            inputEl.value = current ? (context + ' ' + current) : (context + ' ');
            inputEl.focus();
        }
    </script>
<script src="js/scripts.js"></script>
</body>
</html>
