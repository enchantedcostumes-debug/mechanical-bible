<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle - Redirecting...</title>
    <link rel="stylesheet" href="/css/quantum-theme.css">
    <style>
        body {
            background: #000;
            color: #c0c0c0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .redirect-container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        h1 {
            color: #ffd700;
            margin-bottom: 1rem;
        }
        p {
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .query-box {
            background: rgba(192, 192, 192, 0.1);
            border: 1px solid rgba(192, 192, 192, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
            word-break: break-word;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin: 0.5rem;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn-secondary {
            background: rgba(192, 192, 192, 0.2);
            border: 1px solid #c0c0c0;
            color: #c0c0c0;
        }
        .countdown {
            font-size: 2rem;
            color: #ffd700;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <h1>Oracle Redirect</h1>

        <p>The Oracle lives at <strong>enchantedozarks.com</strong></p>

        <div id="query-display" class="query-box" style="display: none;">
            <strong>Your question:</strong>
            <p id="query-text"></p>
        </div>

        <p>Redirecting in <span class="countdown" id="countdown">3</span> seconds...</p>

        <div>
            <a id="oracle-link" href="https://enchantedozarks.com/oracle" class="btn">Go to Oracle Now</a>
            <a href="/" class="btn btn-secondary">Stay on Mechanical Bible</a>
        </div>
    </div>

    <script>
        // Get query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');

        // Build redirect URL
        let redirectUrl = 'https://enchantedozarks.com/oracle';
        if (query) {
            redirectUrl += '?q=' + encodeURIComponent(query);

            // Show the query
            document.getElementById('query-display').style.display = 'block';
            document.getElementById('query-text').textContent = query;
        }

        // Update link
        document.getElementById('oracle-link').href = redirectUrl;

        // Countdown and redirect
        let count = 3;
        const countdownEl = document.getElementById('countdown');

        const timer = setInterval(() => {
            count--;
            countdownEl.textContent = count;

            if (count <= 0) {
                clearInterval(timer);
                window.location.href = redirectUrl;
            }
        }, 1000);
    </script>
</body>
</html>
